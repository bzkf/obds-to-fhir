name: validate-fhir-resources

on:
  pull_request:
    branches:
      - master
      - beta
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  # ModulProstataMapperTest:
  # error: Instance count is 2, which is not within the specified cardinality of 1..1 (for slice Diagnose)
  # error: Instance count is 0, which is not within the specified cardinality of 1..1 (for slice Operation)
  # mii-pr-onko-prostate-clavien-dindo slices Observation.focus using a resolve()-based
  # profile discriminator, which requires the referenced Condition/Procedure to actually be
  # resolvable. These snapshots validate a single extracted Observation outside of any Bundle,
  # so the reference can never resolve and the validator misclassifies both focus entries into
  # the first slice. Confirmed as a false positive: the same resource validates cleanly once it
  # is inside its Bundle with a resolvable (absolute) Bundle.entry.fullUrl, which is what
  # actually gets validated by the validate-bundles job.
  # ModulMalignesMelanomMapperTest:
  # error: Instance failed constraint mii-onko-melanom-sicherheitsabstand-1 "Entweder muss valueQuantity oder dataAbsentReason vorhanden sein"
  # the invariant's expression is `valueQuantity.exists() or dataAbsentReason.exists()`, but FHIRPath labels a
  # choice element by its name without the [x] suffix (<https://hl7.org/fhir/R4/fhirpath.html>, "Polymorphism in
  # FHIR"), so every Observation that carries a measured margin fails it and only the dataAbsentReason case passes.
  # Remove once the IG corrects the expression, see
  # <https://github.com/medizininformatik-initiative/kerndatensatzmodul-onkologie/issues/341>.
  MAPPERS_TO_IGNORE_VALIDATION_ERRORS: |
    [
      "TumorKonferenzMapperTest",
      "PatientMapperTest",
      "ModulProstataMapperTest",
      "SystemischeTherapieMedicationStatementMapperTest",
      "ModulMalignesMelanomMapperTest"
    ]

jobs:
  extract-mapper-names:
    name: extract mapper names
    runs-on: ubuntu-24.04
    container: ghcr.io/miracum/ig-build-tools:v2.6.1@sha256:77825ffad88656e5c07df8e6b62866f0473cacfed61a25f953d431c5ec47de72
    outputs:
      mapper-names: ${{ steps.extract.outputs.mapper-names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Find unique prefixes
        id: extract
        run: |
          PREFIXES=$(find mappings/src/test/java/snapshots/io/github/bzkf/obdstofhir/mapper/mii/ -depth -maxdepth 1 -type f -name "*.fhir.json" \
            | awk -F'/' '{split($NF, parts, "\\."); print parts[1]}' | sort -u | jq -R . | jq -s -c .)
          echo "Extracted prefixes: $PREFIXES"
          echo "mapper-names=$PREFIXES" >> "$GITHUB_OUTPUT"

      # restore the fhir packages once per workflow run here to avoid multiple
      # jobs running in parallel each restoring at the same time
      - name: Cache FHIR packages
        id: fhir-package-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /github/home/.fhir/packages
            fhirpkg.lock.json
          key: fhir-packages-${{ hashFiles('package.json') }}
          restore-keys: |
            fhir-packages-

      # Firely Terminal 4 exits non-zero on the dependency cycle between hl7.terminology.r4 and
      # hl7.fhir.uv.extensions.r4 (CircularReference, OutOfRange), even though the packages get
      # installed. Its exit code is ignored, but the step fails if a direct dependency is missing:
      # the other jobs only restore the cache, so an incomplete restore must not be saved to it.
      - name: Restore FHIR package dependencies
        if: ${{ steps.fhir-package-cache.outputs.cache-hit != 'true' }}
        run: |
          fhir cache location --path
          fhir cache list
          fhir restore || echo "::warning::fhir restore exited with code $?, checking the installed packages"
          PACKAGES_DIR=$(fhir cache location --path)
          jq -r '.dependencies | to_entries[] | "\(.key)#\(.value)"' package.json | while read -r package; do
            if [ ! -d "$PACKAGES_DIR/$package" ]; then
              echo "::error::FHIR package $package is missing after fhir restore"
              exit 1
            fi
            echo "found $package"
          done

  validate-fhir-resource:
    name: validate fhir resources
    runs-on: ubuntu-24.04
    container: ghcr.io/miracum/ig-build-tools:v2.6.1@sha256:77825ffad88656e5c07df8e6b62866f0473cacfed61a25f953d431c5ec47de72
    needs:
      - extract-mapper-names
    strategy:
      # show all validations results instead of stopping at the first failure
      fail-fast: false
      # reduce the parallel load so it doesn't end up blocking other jobs.
      max-parallel: 4
      matrix:
        mapper: ${{ fromJson(needs.extract-mapper-names.outputs.mapper-names) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure fhir cli
        run: |
          fhir config inflate All
          fhir config validate firely

      - name: Cache FHIR packages
        id: fhir-package-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /github/home/.fhir/packages
            fhirpkg.lock.json
          key: fhir-packages-${{ hashFiles('package.json') }}
          restore-keys: |
            fhir-packages-

      - name: Validate generated FHIR resources
        continue-on-error: ${{contains(fromJson(env.MAPPERS_TO_IGNORE_VALIDATION_ERRORS), env.MAPPER_NAME) }}
        env:
          MAPPER_NAME: ${{ matrix.mapper }}
        run: |
          fhir cache location --path
          fhir cache list
          echo "Validating files for mapper: ${MAPPER_NAME}"
          find mappings/src/test/java/snapshots/io/github/bzkf/obdstofhir/mapper/mii/ -maxdepth 1 -type f \
            -name "${MAPPER_NAME}*.fhir.json" -print0 | \
            xargs -0 -I {} sh -c 'echo "  Validating: {}" && fhir validate --verbose "{}" --fail-on error'

  validate-bundles:
    name: validate bundles
    runs-on: ubuntu-24.04
    container: ghcr.io/miracum/ig-build-tools:v2.6.1@sha256:77825ffad88656e5c07df8e6b62866f0473cacfed61a25f953d431c5ec47de72
    needs:
      - extract-mapper-names
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure fhir cli
        run: |
          fhir config inflate All
          fhir config validate firely

      - name: Cache FHIR packages
        id: fhir-package-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /github/home/.fhir/packages
            fhirpkg.lock.json
          key: fhir-packages-${{ hashFiles('package.json') }}
          restore-keys: |
            fhir-packages-

      # informational only for now, evaluated alongside the .NET (Firely) validator below
      # before switching over. Does not gate the build yet.
      # validates all bundles in a single validator_cli.jar invocation (one shared FHIR
      # context load instead of one per file) and produces one combined HTML report.
      - name: Validate bundles (Java validator)
        continue-on-error: true
        run: |
          # derives the -version/-ig args for the Java validator (validator_cli.jar) directly
          # from package.json, so it stays in sync with whatever packages are declared there.
          VALIDATOR_ARGS=$(jq -r '
            (["-version", .fhirVersions[0], "-tx", "n/a"]) as $base |
            ( .dependencies | to_entries | map(select(.key != "hl7.fhir.r4.core")) | map(["-ig", (.key + "#" + .value)]) | add // [] ) as $igs |
            ($base + $igs) | join(" ")
          ' package.json)
          echo "Derived validator args: $VALIDATOR_ARGS"
          # shellcheck disable=SC2086 # VALIDATOR_ARGS must word-split into separate flags
          java -jar /usr/local/bin/validator_cli.jar \
            mappings/src/test/java/snapshots/io/github/bzkf/obdstofhir/mapper/mii/ObdsToFhirBundleMapperTest/*.fhir.json \
            $VALIDATOR_ARGS -html-output=java-validator-bundles-report.html

      - name: Upload Java validator bundle report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-validator-bundles-report
          path: java-validator-bundles-report.html

      - name: Validate bundles (records validator)
        uses: medvertical/records-fhir-validator@0492195d1b180e81fa85a1cff9c9de6a632d64fd # v0.7.0
        with:
          paths: |
            mappings/src/test/java/snapshots/io/github/bzkf/obdstofhir/mapper/mii/ObdsToFhirBundleMapperTest/*.fhir.json
          fhir-version: R4
          fail-on: none

      - name: Validate bundles
        continue-on-error: true
        run: |
          fhir cache location --path
          fhir cache list
          find mappings/src/test/java/snapshots/io/github/bzkf/obdstofhir/mapper/mii/ObdsToFhirBundleMapperTest/ -type f \
            -name "*.fhir.json" -print0 | \
            xargs -0 -I {} sh -c 'echo "\n\n\nValidating: {}" && fhir validate --verbose "{}" --fail-on error'
