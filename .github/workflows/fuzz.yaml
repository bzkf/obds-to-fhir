name: fuzz

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to fuzz, e.g. 30s, 10m, 1h"
        type: string
        required: false
        default: "10m"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    name: Fuzz the oBDS to FHIR mapping (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # mapObds fuzzes the XML, mapMutatedObds the content of valid oBDS
        target: [mapObds, mapMutatedObds]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Gradle
        # zizmor: ignore[cache-poisoning] cache writes are already read-only outside the default branch (gradle/actions default behavior)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # keep the inputs that gained coverage, so each run continues where the last one stopped
      - name: Cache fuzz corpus
        # zizmor: ignore[cache-poisoning] no release artifacts are built here, and caches written by a manual run on another branch are scoped to that branch
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mappings/.cifuzz-corpus/io.github.bzkf.obdstofhir.mapper.mii.ObdsToFhirBundleMapperFuzzTest/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          FUZZ_DURATION: ${{ inputs.duration || '10m' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          ./gradlew :mappings:fuzz -PfuzzTarget="${FUZZ_TARGET}" -PfuzzDuration="${FUZZ_DURATION}"

      - name: Upload crashing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: |
            mappings/src/test/resources/io/github/bzkf/obdstofhir/mapper/mii/ObdsToFhirBundleMapperFuzzTestInputs/${{ matrix.target }}/
            mappings/build/reports/tests/fuzz/
