// groovylint-disable NestedBlockDepth

plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'io.freefair.lombok' version '9.8.3'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'io.gitee.pkmer.sonatype-central-publisher' version '1.1.0'
}

group = 'io.github.bzkf'
version = '3.10.8'

dependencyManagement {
  imports {
    mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
  }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// The fuzz tests have a source set of their own, as OpenSSF Scorecard ignores everything under
// src/test/ when it looks for fuzzing. Their inputs stay in src/test/resources, where Jazzer
// saves new findings, so test's output is on their classpath.
sourceSets {
    fuzzTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    fuzzTestImplementation.extendsFrom testImplementation
    fuzzTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.18'
    implementation 'com.github.slugify:slugify:4.0.1'

    // the lib also includes the oBDS model classes
    api 'io.github.bzkf:obds2-to-obds3:0.1.24'
    api 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:9.0.0'
    api 'io.github.diz-uker:to-fhir:0.2.21'
    // api so the modules depending on this one (e.g. the root app's tests) can use the same
    // version of the profile/CodeSystem constants
    api 'io.github.diz-uker:fhir-ig-constants:0.2.21'
    api 'org.slf4j:slf4j-api:2.0.20'
    api 'org.apache.commons:commons-csv:1.14.1'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.approvaltests:approvaltests:31.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    fuzzTestImplementation 'com.code-intelligence:jazzer-junit:0.30.0'

    testFixturesImplementation 'org.assertj:assertj-core:3.27.7'
    testFixturesImplementation 'com.approvaltests:approvaltests:31.0.0'
    // MapperTest uses the mapper of Obdsv3Deserializer, which implements a Kafka interface
    testFixturesImplementation 'org.apache.kafka:kafka-clients'
}

test {
    useJUnitPlatform()
}

// Fuzzing, see DEVELOPMENT.md. `fuzzTest` replays the inputs in the fuzz tests' *Inputs
// directories like unit tests (Jazzer's regression mode), `fuzz` generates new ones.
def fuzzTest = tasks.register('fuzzTest', Test) {
    description = 'Replays the inputs of the fuzz tests.'
    group = 'verification'
    testClassesDirs = sourceSets.fuzzTest.output.classesDirs
    classpath = sourceSets.fuzzTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn fuzzTest
}

def fuzzTestClass = 'io.github.bzkf.obdstofhir.mapper.mii.ObdsToFhirBundleMapperFuzzTest'
// mapObds or mapMutatedObds
def fuzzTestMethod = project.findProperty('fuzzTarget') ?: 'mapObds'
def fuzzCorpusDir = layout.projectDirectory.dir(".cifuzz-corpus/${fuzzTestClass}/${fuzzTestMethod}")

tasks.register('seedFuzzCorpus', Copy) {
    description = 'Copies the oBDS test files into the corpus of mapObds as starting points.'
    // the inputs of mapMutatedObds are the mutator's decisions, not XML
    onlyIf { fuzzTestMethod == 'mapObds' }
    from 'src/test/resources/obds3'
    include '*.xml'
    into fuzzCorpusDir
}

tasks.register('fuzz', Test) {
    description = 'Fuzzes the oBDS to FHIR mapping. -PfuzzTarget=mapMutatedObds selects the other ' +
        'fuzz test, -PfuzzDuration=30s overrides the 10m default.'
    group = 'verification'
    dependsOn 'seedFuzzCorpus'
    testClassesDirs = sourceSets.fuzzTest.output.classesDirs
    classpath = sourceSets.fuzzTest.runtimeClasspath
    useJUnitPlatform()
    // Jazzer fuzzes only one fuzz test per JVM
    filter {
        includeTestsMatching "${fuzzTestClass}.${fuzzTestMethod}"
    }
    environment 'JAZZER_FUZZ', '1'
    // otherwise the JIT replaces frequently thrown NPEs with ones without message and stack trace,
    // which the fuzz test then can't recognize as known issues
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    // the mappers log a resource diff for every duplicate, which floods the output and slows
    // down fuzzing
    systemProperty 'logging.level.io.github.bzkf', 'ERROR'
    systemProperty 'jazzer.instrument', 'io.github.bzkf.**,de.basisdatensatz.**,tools.jackson.dataformat.xml.**'
    if (project.hasProperty('fuzzDuration')) {
        systemProperty 'jazzer.max_duration', project.property('fuzzDuration')
    }
    // collect up to this many distinct findings instead of stopping at the first one
    if (project.hasProperty('fuzzKeepGoing')) {
        systemProperty 'jazzer.keep_going', project.property('fuzzKeepGoing')
    }
    // with the JaCoCo agent, the fuzzer can crash the JVM on JDK 25,
    // see https://github.com/CodeIntelligenceTesting/jazzer/issues/1035
    jacoco {
        enabled = false
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'obds-to-fhir'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'obds-to-fhir'
                description = 'Library used to map oBDS v3 messages to MII-conformant FHIR resources.'
                url = 'https://github.com/bzkf/obds-to-fhir'
                licenses {
                    license {
                        name = 'GPL-3.0-only'
                        url = 'https://opensource.org/license/GPL-3.0'
                    }
                }
                developers {
                    developer {
                        id = 'BZKF'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/bzkf/obds-to-fhir.git'
                    developerConnection = 'scm:git:ssh://github.com:bzkf/obds-to-fhir.git'
                    url = 'https://github.com/bzkf/obds-to-fhir'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repos/bundles')
        }
    }
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

signing {
    def signingKey = System.getenv('SIGNING_KEY')
    def signingPassword = System.getenv('SIGNING_KEY_PASSPHRASE')
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

pkmerBoot {
    sonatypeMavenCentral {
        // the same with publishing.repositories.maven.url in the configuration.
        stagingRepository = layout.buildDirectory.dir('repos/bundles')
        /**
         * get username and password from
         * <a href='https://central.sonatype.com/account'> central sonatype account</a>
         */
        username = System.getenv('OSSRH_USERNAME')
        password = System.getenv('OSSRH_PASSWORD')
    }
}

spotless {
    java {
        target('**/*.java')
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
    }
}
